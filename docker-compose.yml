services:

  mongo:
    image: mongo:7
    container_name: foodexpress-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: foodexpress-backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/foodexpress
      - PORT=3000
      - JWT_SECRET=foodexpress_clave_docker_demo
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: foodexpress-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  mongo_data: